<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公交安全总览 - 公交安全与舒适度平台</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <div id="nav" class="nav"></div>
  <div class="container">
    <h1>公交安全总览</h1>
    <p class="muted small">数据来源：GET /api/v1/dashboard/overview ｜ 每 30 秒自动刷新 ｜ 统计日期：<span id="stat-date">—</span></p>

    <h2>当前运营车辆状态（按当日最新 DMS 风险等级）</h2>
    <div class="cards">
      <div class="card level-bg-NORMAL"><div class="label">正常 NORMAL</div><div class="num level-NORMAL" id="cnt-normal">—</div></div>
      <div class="card level-bg-WARNING"><div class="label">预警 WARNING</div><div class="num level-WARNING" id="cnt-warning">—</div></div>
      <div class="card level-bg-HIGH"><div class="label">高风险 HIGH</div><div class="num level-HIGH" id="cnt-high">—</div></div>
    </div>

    <h2>今日事件与舒适度</h2>
    <div class="cards">
      <div class="card level-bg-HIGH"><div class="label">今日疲劳高风险事件</div><div class="num level-HIGH" id="cnt-fatigue-high">—</div></div>
      <div class="card level-bg-INFO"><div class="label">今日车辆运动事件</div><div class="num" id="cnt-motion">—</div></div>
      <div class="card level-bg-INFO"><div class="label">平均舒适度（0~100，越高越舒适）</div><div class="num" id="avg-comfort">—</div></div>
    </div>

    <div id="status" class="loading">加载中…</div>
    <p class="footer-note">本系统为安全提示与关怀系统：单次事件不作归责；无信息时责任归因为 UNKNOWN；司机相关推断仅为 SUSPECTED（疑似），需人工复核。</p>
  </div>

  <script src="api.js"></script>
  <script>
    renderNav('index');

    async function loadOverview() {
      const status = document.getElementById('status');
      try {
        const d = await apiGet('/api/v1/dashboard/overview');
        document.getElementById('stat-date').textContent = d.date || '—';
        const counts = d.vehicle_status_counts || {};
        document.getElementById('cnt-normal').textContent = counts.NORMAL || 0;
        document.getElementById('cnt-warning').textContent = counts.WARNING || 0;
        document.getElementById('cnt-high').textContent = counts.HIGH || 0;
        document.getElementById('cnt-fatigue-high').textContent = d.today_fatigue_high_count;
        document.getElementById('cnt-motion').textContent = d.today_motion_event_count;
        document.getElementById('avg-comfort').textContent = fmtScore(d.avg_comfort_score);
        status.textContent = '最后更新：' + new Date().toLocaleTimeString();
      } catch (e) {
        showError(status, e);
      }
    }

    loadOverview();
    setInterval(loadOverview, 30000);
  </script>
</body>
</html>
