# Hand Capture Right - DHCP 配置模板
# 会被 /etc/init.d/S41wifi_ap 动态覆盖，此处仅作备份参考

start 192.168.4.10
end 192.168.4.50
interface wlan0
opt router 192.168.4.1
opt subnet 255.255.255.0
opt dns 192.168.4.1
opt lease 86400

# 把接收服务器（PC/笔记本）固定分配为 192.168.4.17
# 请把 MAC 地址换成你 PC 的真实 WiFi MAC
static_lease 00:11:22:33:44:55 192.168.4.17
